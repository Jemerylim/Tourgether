services:
  backend:
    build: ./backend
    container_name: backend-container
    restart: always
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    env_file:
      - ./backend/.env
    networks:
      - app-network


  frontend:
    build:
      context: ./client
      args:
        # Empty uses client/.env.production; set it in a root .env to point elsewhere
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: client-container
    restart: always
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
