server {
    listen 80;
    # Answer on any host name or IP, so the same image works wherever it is deployed
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Handle React routes correctly (prevent 404 on refresh)
    location / {
        try_files $uri /index.html;
    }

    # Proxy API requests and uploaded files to the backend. No trailing slash on
    # proxy_pass, so the /api prefix the backend routes expect is kept.
    location ~ ^/(api|uploads)/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Vite puts hashed bundles in /assets/, so they can be cached forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
